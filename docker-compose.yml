services:
    postgres:
        image: postgres
        container_name: fsc-fintrack-postgres
        environment:
            POSTGRES_PASSWORD: password
            POSTGRES_USER: postgres
            POSTGRES_DB: fsc-fintrack
        ports:
            - '5432:5432'
        volumes:
            - ./.postgres-data:/var/lib/postgresql

    postgres-test:
        image: postgres
        container_name: fsc-fintrack-postgres-test
        environment:
            POSTGRES_PASSWORD: password
            POSTGRES_USER: postgres
            POSTGRES_DB: fsc-fintrack
        ports:
            - '5433:5432'
